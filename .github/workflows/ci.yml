name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build, lint, typecheck and test
        run: pnpm turbo run build lint typecheck test
      - name: Validate package manifests and exports
        run: pnpm publint
      - name: Validate packed ESM types
        run: pnpm attw
      - name: Check release plan
        run: pnpm changeset status
      - name: Enforce type instantiation budget
        run: pnpm type-budget

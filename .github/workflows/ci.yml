name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build, lint, typecheck and test
        run: pnpm turbo run build lint typecheck test
      - name: Validate package manifests and exports
        run: pnpm publint
      - name: Validate packed ESM types
        run: pnpm attw
      - name: Check release plan
        # Detached PR checkouts have origin/main, but no local main branch.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "changeset-release/main" ]; then
            pnpm check-version-plan
          else
            pnpm changeset status --since origin/main
          fi
      - name: Enforce type instantiation budget
        run: pnpm type-budget

name: Release rehearsal

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status
      # No publish-script input or npm credentials: version PRs only.
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: pnpm version-packages
          commit-message: |
            chore: version packages

            Co-Authored-By: Codex <noreply@openai.com>
          pr-title: "chore: version packages"
          create-github-releases: false
          push-git-tags: false
      - name: Confirm rehearsal did not publish
        run: |
          test "${{ steps.changesets.outputs.published }}" != "true"
          echo "Rehearsal complete; npm publishing is disabled."
